name: RaceDay Part 1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          echo "Checking RaceDay Part 1 repository structure..."

          test -d docs
          test -f docs/RaceDay_ERD.png
          test -f docs/API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql
          test -f README.md

          echo "All required Part 1 files are present."

      - name: Validate SQL file
        run: |
          test -s docs/RaceDay_Database.sql
          echo "SQL database script exists and is not empty."

      - name: Validate API endpoint plan
        run: |
          test -s docs/API_Endpoint_Plan.md
          echo "API endpoint plan exists and is not empty."

      - name: Validate ERD
        run: |
          test -s docs/RaceDay_ERD.png
          echo "ERD image exists and is not empty."

      - name: Validation successful
        run: echo "RaceDay Part 1 CI validation completed successfully."
